name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      # Встраиваем нативный код: баннеры поверх приложений, фоновая служба, разрешения
      - run: python3 native/patch_android.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Bit-learning-app-003.apk
      # Подпись должна совпасть с постоянным ключом, иначе новая версия не встанет поверх старой
      - name: Проверка подписи
        run: |
          exp=$(keytool -list -keystore native/debug.keystore -storepass android | grep "SHA-256" | sed 's/.*: //')
          got=$(keytool -printcert -jarfile Bit-learning-app-003.apk | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "ключ: $exp"; echo "apk:  $got"; [ "$exp" = "$got" ]
      - uses: actions/upload-artifact@v4
        with:
          name: Bit-learning-app-003-apk
          path: Bit-learning-app-003.apk
      # Релиз 003. Релизы «latest» и «002» с прежними сборками не трогаем.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "003"
          name: "Версия 003 — тревога-уведомления и диагностика"
          body: "Сборка 003: баннер поверх других приложений, тревога-уведомления каждые 0,7 с на последней стадии, диагностика службы, подробная теория. Предыдущие версии остаются в релизах 002 и «Последняя сборка APK»."
          files: Bit-learning-app-003.apk
          make_latest: "false"
