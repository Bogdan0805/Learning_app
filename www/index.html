.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}

.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid #9ca3af66;border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--pri);background:#58cc0233}.opt.no{border-color:var(--bad);background:#ef444433;opacity:.6}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row span:first-child{font-size:26px}.row b{flex:1}

canvas{display:block;margin:0 auto;max-width:100%}.ptr{text-align:center;font-size:28px;margin-bottom:-12px;position:relative}

#ban h1{font-size:34px}#ban .btn{max-width:360px}

.top{display:flex;justify-content:space-between;font-weight:700}.rule{background:#58cc0222;border-left:5px solid var(--pri);padding:10px 12px;border-radius:8px;line-height:1.8;margin:8px 0}.ex{background:#3b82f622;padding:10px 12px;border-radius:8px;margin:8px 0}.tip{background:#f59e0b22;padding:10px 12px;border-radius:8px;margin:8px 0}

geo2:PR(['Прямая параллельна плоскости, если не имеет с ней общих точек.|1|Определение','Прямая вне плоскости, параллельная прямой в этой плоскости, параллельна плоскости.|1|Признак параллельности','Прямая, параллельная плоскости, параллельна любой прямой в этой плоскости.|0|Может быть скрещивающейся с ней','Через точку вне плоскости проходит ровно одна прямая, параллельная плоскости.|0|Таких прямых бесконечно много','Если прямая пересекает плоскость, она не параллельна ей.|1|Есть общая точка','Прямая, лежащая в плоскости, параллельна этой плоскости.|0|Общих точек у них много','Если плоскость через прямую a ∥ α пересекает α по прямой b, то a ∥ b.|1|Свойство параллельности','В кубе ABCDA₁B₁C₁D₁ прямая A₁B₁ параллельна плоскости ABC.|1|A₁B₁ ∥ AB','В кубе прямая AA₁ параллельна плоскости ABC.|0|AA₁ пересекает ABC в точке A','В кубе прямая CC₁ параллельна плоскости AA₁B₁B.|1|CC₁ ∥ AA₁','Две прямые, параллельные одной плоскости, параллельны между собой.|0|Могут пересекаться или скрещиваться','Параллельная плоскости прямая не имеет с ней общих точек.|1|Определение'],TF),
geo3:PR(['Прямая ⟂ плоскости, если она ⟂ двум пересекающимся прямым этой плоскости.|1|Признак перпендикулярности','Прямая ⟂ плоскости, если она ⟂ одной прямой этой плоскости.|0|Нужны две пересекающиеся','Прямая, ⟂ плоскости, ⟂ любой прямой в этой плоскости.|1|Определение','Через точку проходит ровно одна прямая, ⟂ данной плоскости.|1|Теорема о единственности','Две прямые, ⟂ одной плоскости, параллельны.|1|Теорема','В кубе ребро AA₁ ⟂ плоскости ABC.|1|AA₁ ⟂ AB и AA₁ ⟂ AD','В кубе ребро AB ⟂ плоскости ADD₁A₁.|1|AB ⟂ AD и AB ⟂ AA₁','Перпендикуляр короче любой наклонной из той же точки.|1|Катет короче гипотенузы','Равные наклонные из одной точки имеют равные проекции.|1|Равные прямоугольные треугольники','Если прямая ⟂ проекции наклонной, то она ⟂ и наклонной.|1|Теорема о трёх перпендикулярах','Две плоскости, ⟂ одной прямой, пересекаются.|0|Они параллельны','Угол между прямой и плоскостью может быть больше 90°.|0|Он лежит в пределах от 0° до 90°'],TF),
geo4:()=>{const t=rnd(0,4),a=rnd(2,9),b=rnd(2,9),c=rnd(2,9),r=pick([[1,2,2,3],[2,3,6,7],[2,4,4,6],[1,4,8,9],[4,4,7,9],[3,4,12,13],[2,6,9,11],[4,8,8,12],[6,6,7,11]]),S=2*(a*b+b*c+c*a);if(t==0)return MQ(`Измерения параллелепипеда ${a}, ${b}, ${c}. Объём?`,a*b*c,[a+b+c,a*b+b*c+c*a,2*a*b*c],`${a}·${b}·${c}`);if(t==1)return MQ(`Измерения параллелепипеда ${a}, ${b}, ${c}. Площадь поверхности?`,S,[a*b*c,S/2,S+a*b],`2(ab+bc+ca) = ${S}`);if(t==2)return MQ(`Измерения параллелепипеда ${r[0]}, ${r[1]}, ${r[2]}. Диагональ?`,r[3],[r[0]+r[1]+r[2],r[3]+1,r[3]-1],`√(${r[0]**2}+${r[1]**2}+${r[2]**2}) = ${r[3]}`);if(t==3)return MQ(`Ребро куба ${a}. Диагональ куба?`,`${a}√3`,[`${a}√2`,`${3*a}`,`${a*a}√3`],'d = a√3');return MQ(`Ребро куба ${a}. Площадь поверхности?`,6*a*a,[4*a*a,a**3,6*a],`6·${a}² = ${6*a*a}`)},
geo5:()=>{const t=rnd(0,3),S=rnd(2,15),h=rnd(2,9),a=rnd(2,9),r=pick([[3,4],[6,8],[5,12],[8,15]]);if(t==0)return MQ(`Площадь основания призмы ${S}, высота ${h}. Объём?`,S*h,[S+h,S*h+S,S*h*2],`V = S·h = ${S*h}`);if(t==1)return MQ(`Периметр основания прямой призмы ${2*S}, боковое ребро ${h}. Площадь боковой поверхности?`,2*S*h,[S*h,2*S+h,2*S*h+2*S],`P·h = ${2*S*h}`);if(t==2)return MQ(`Основание прямой призмы — прямоугольный треугольник с катетами ${r[0]} и ${r[1]}, высота ${h}. Объём?`,r[0]*r[1]/2*h,[r[0]*r[1]*h,(r[0]+r[1])*h,r[0]*r[1]/2+h],`(${r[0]}·${r[1]}/2)·${h}`);return MQ(`Основание призмы — квадрат со стороной ${a}, высота ${h}. Площадь полной поверхности?`,2*a*a+4*a*h,[a*a*h,4*a*h,2*a*a+2*a*h],`2·${a}² + 4·${a}·${h}`)},
geo6:()=>{const t=rnd(0,3),S=rnd(1,10)*3,h=rnd(2,9),a=rnd(2,9),k=rnd(1,4),P=rnd(2,10)*2,l=rnd(2,9),V=rnd(2,15)*3;if(t==0)return MQ(`Площадь основания пирамиды ${S}, высота ${h}. Объём?`,S*h/3,[S*h,S*h/3+h,S*h*3],`⅓·${S}·${h}`);if(t==1)return MQ(`Правильная четырёхугольная пирамида: сторона основания ${a}, высота ${3*k}. Объём?`,a*a*k,[a*a*3*k,a*a*k+a,4*a*k],`⅓·${a*a}·${3*k} = ${a*a*k}`);if(t==2)return MQ(`Периметр основания правильной пирамиды ${P}, апофема ${l}. Площадь боковой поверхности?`,P*l/2,[P*l,P+l,P*l/2+P],`½·${P}·${l}`);return MQ(`Объём призмы ${V}. Пирамида с тем же основанием и высотой имеет объём…`,V/3,[V/2,V*3,V/3+3],'Пирамида втрое меньше призмы')},

rus3:T('<b>-лаг- / -лож-</b>: перед Г — «а», перед Ж — «о» (предлагать — предложить)<br><b>-раст- / -ращ- / -рос-</b>: перед СТ и Щ — «а», иначе «о» (вырастить, выращенный, заросли). Исключения: отрасль, росток, Ростов<br><b>-кас- / -кос-</b>: есть суффикс -А- → «а» (касаться), нет → «о» (коснуться)<br><b>-мир- / -мер-</b>: есть -А- → «и» (умирать), нет → «е» (умереть)','предлагать — предложить; касаться — коснуться','Ищи в слове суффикс -А-: от него зависит гласная корня.'),

rus6:T('Вопрос <b>«что делает?»</b> → <b>-ТСЯ</b>: он учится, она купается<br>Вопрос <b>«что делать?»</b> (инфинитив) → <b>-ТЬСЯ</b>: хочу учиться, пора купаться','Он учится (что делает?). Хочу учиться (что делать?)','Задай вопрос к слову: есть «ь» в вопросе — пиши -ться.'),

inf5:T('<b>Время = объём / скорость</b>, объём = скорость · время<br>1 байт = 8 бит<br>1 Кбайт = 1024 байт, 1 Мбайт = 1024 Кбайт<br>Единицы должны совпадать (байты с байтами, секунды с секундами)','файл 120 Кбайт, скорость 20 Кбайт/с: t = 120/20 = <b>6 с</b>','Если единицы разные — сначала приведи к одним.'),

inf7:T('<b>IPv4-адрес</b> — 4 числа от 0 до 255 через точки (по байту на число)<br><b>HTTP</b> — передача веб-страниц, <b>SMTP</b> — отправка почты<br><b>ОЗУ</b> — быстрая энергозависимая память, <b>HDD/SSD</b> — постоянное хранение<br>Процессор выполняет команды программ','192.168.0.1 — корректный адрес, 192.168.0.256 — нет','Один байт хранит числа 0–255 — поэтому и в IP такой предел.'),
phy2:T('Плотность: <b>ρ = m/V</b>, m = ρ·V, V = m/ρ<br>Давление: <b>p = F/S</b> (Па = Н/м²)<br>Чем больше площадь, тем меньше давление при той же силе','m = 3 г/см³ · 10 см³ = <b>30 г</b>','Следи за единицами: г ↔ см³, кг ↔ м³.'),
phy3:T('Работа: <b>A = F·s</b> (Дж)<br>Мощность: <b>P = A/t</b> (Вт)<br>Кинетическая энергия: <b>Eк = mv²/2</b><br>Потенциальная: <b>Eп = mgh</b>, g ≈ 10 м/с²','F = 5 Н, s = 4 м: A = <b>20 Дж</b>','Если сила перпендикулярна перемещению, работа равна нулю.'),
phy4:T('<b>Закон Ома: I = U/R</b>, U = I·R, R = U/I<br>Мощность: <b>P = U·I</b><br>Последовательно: R = R₁ + R₂<br>Параллельно: 1/R = 1/R₁ + 1/R₂','I = 2 А, R = 5 Ом: U = <b>10 В</b>','Нарисуй треугольник U–I–R и закрой пальцем искомую величину.'),
phy5:T('Количество теплоты: <b>Q = c·m·Δt</b><br>Вода: c = 4200 Дж/(кг·°C)<br>КПД: <b>η = Aп/Aз · 100%</b><br>Кельвины: <b>T = t + 273</b>','нагреть 1 кг воды на 2 °C: Q = 4200·1·2 = <b>8400 Дж</b>','КПД всегда меньше 100%.'),
phy6:T('Период и частота: <b>T = 1/ν</b>, ν = 1/T (Гц)<br>Длина волны: <b>λ = v/ν</b>, v = λ·ν<br>Число колебаний: N = t/T','ν = 5 Гц → T = <b>0,2 с</b>','Период и частота — взаимно обратные величины.'),

eng2:T(`Past Simple — действие в прошлом, время названо (yesterday, last week, ago)<br>Правильные глаголы: <b>V + -ed</b> (played)<br>Неправильные — вторая форма: go → <b>went</b>, see → <b>saw</b>, have → <b>had</b>, do → <b>did</b>`,`I saw him yesterday.`,`Видишь yesterday или ago — ставь вторую форму глагола.`),
eng3:T(`<b>a</b> — перед согласным звуком (a book), <b>an</b> — перед гласным звуком (an apple, an hour)<br><b>the</b> — известный предмет, единственный в своём роде (the sun), превосходная степень, музыкальные инструменты<br>Без артикля — общий смысл, множественное число, go to school`,`She is a teacher. The sun is hot. I like music.`,`Смотри на звук, а не на букву: an hour, a university.`),
eng4:T(`<b>can</b> — умение; <b>must</b> — обязанность; <b>should</b> — совет<br><b>may</b> — разрешение, возможность; <b>could</b> — вежливая просьба<br>mustn't — нельзя, needn't — не нужно<br>После модального глагола — инфинитив <b>без to</b>`,`You must wear a helmet. She can swim.`,`После модального глагола не бывает ни to, ни окончания -s.`),
eng5:T(`<b>was / were + V-ing</b><br>Длительное действие в конкретный момент прошлого (at 5 p.m. yesterday)<br>I / he / she / it — was, you / we / they — were<br>Часто: одно действие прервало другое (was cooking, when the phone rang)`,`I was watching TV at 5 p.m.`,`Назван точный момент или есть when + короткое действие — Past Continuous.`),
eng6:T(`Короткие прилагательные: <b>-er / the -est</b> (tall → taller → the tallest)<br>Длинные: <b>more / the most</b> (more interesting)<br>Исключения: good → <b>better → the best</b>, bad → <b>worse → the worst</b><br>Сравнение — со словом than`,`This book is more interesting than that one.`,`Слово than подсказывает сравнительную степень.`),
eng7:T(`<b>in</b> — месяцы, годы, части суток (in May, in 2008, in the evening), города<br><b>on</b> — дни и даты (on Monday, on 5 May), поверхности<br><b>at</b> — точное время (at 7 o'clock), at home, at school<br><b>by</b> — транспорт (by bus), но on foot`,`She was born in 2008, on Monday, at 7 o'clock.`,`От большого к малому: in (год) → on (день) → at (час).`),

function showBan(){stage=Math.min(stage+1,3);const b=$('#ban'),t=ST[stage-1];b.className='s'+stage;b.style.display='flex';b.innerHTML=`<div class="big">${['🤖','😠','👿'][stage-1]}</div><h1>${t[0]}</h1><p>${t[1]}</p><button class="btn" style="background:#fff;color:#111;border-color:#ddd" onclick="startChoice()">Учиться</button><button class="btn alt" style="background:#0003;color:#fff" onclick="closeBan()">Закрыть</button>`}
function closeBan(){hideBan();nextShow=Date.now()+(DEMO.on?8000:60000)}
function hideBan(){$('#ban').style.display='none'}
setInterval(()=>{if(!S.setup)return;if(S.day!==today()){S.day=today();S.cnt=0;trig=null;save()}
if(S.cnt>=S.n){trig=null;stage=0;return}
const [h,m]=S.time.split(':').map(Number),d=new Date(),due=DEMO.on||d.getHours()*60+d.getMinutes()>=h*60+m;
if(!due)return;
if(!trig){trig=Date.now();stage=0;nextShow=trig+(DEMO.on?8000:300000);try{if(Notification.permission==='granted')new Notification('Бит: пора учиться! 🤖',{body:'Дневной урок ждёт тебя'})}catch(e){}}
if(!inLesson&&Date.now()>=nextShow&&$('#ban').style.display!=='flex'){showBan()}},1000);
S.setup?home():setup1();
</script></body></html>
